# 경기 노인복지관·시니어클럽 출처 설정 초안 (2026-11-18, docs/경기-복지관-조사-2026-11-18.md)
# 목록: 경기도노인종합복지관협회 회원기관 69곳 + 한국시니어클럽협회 경기도 30곳 (사용자가 브라우저로 저장한 페이지에서 추출)
# 부천 원미·소사·오정 복지관과 부천시니어클럽은 시 공동 포털 게시판 하나라 한 항목으로 묶음
#
# 수집 방식(parser):
#   dated_list = 범용 목록 파서 — 목록 페이지에서 '날짜가 가까이 붙은 링크'를 글로 읽음 (서버가 HTML로 그려 주는 게시판)
#   g5         = 그누보드 (기존 _scrape_g5_board)
#   anyboard   = 은평노인복지관과 같은 플랫폼 (/main/sub.html?boardID=wwwN, 글 링크에 Mode=view)
#   json_api   = 목록을 JSON으로 받는 사이트 (전용 파서)
#   js_link    = 글 링크가 자바스크립트(onclick)인 게시판 (전용 파서)
#   bid        = /bbs/?bid=이름 형식 게시판 (중원·동작노인종합복지관과 같은 플랫폼)
# status: ok(목록 확인) / todo(추가 확인 필요) / stale(찾은 게시판에 최근 글 없음) / blocked(403 등 차단 — 우회하지 않음) / none(홈페이지 없음·블로그)
# stats: 점검 시점(2026-11-18)의 최근 30일 글 수, 규칙 필터 제외 수/목록 글 수, 최신 글 날짜
# tls: chain = 중간 인증서 누락 → backend/certs/intermediates.pem에 추가 필요 (ca_issuer = 받을 주소)
#
# 아직 파이프라인에 연결하지 않음: 앱에 경기 지역(시·도 → 시·군 2단계)과 'all' 토픽 정책을 먼저 정해야 함



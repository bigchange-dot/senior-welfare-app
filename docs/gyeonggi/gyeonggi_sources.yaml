# 1차 필터 (Gemini 호출 전, 규칙 기반) — 고시공고는 공시송달·도로점용이 대부분이라 필수
filter:
  include_title_keywords: [노인, 어르신, 경로, 실버, 시니어, 고령, 65세, 요양, 돌봄, 치매,
                           기초연금, 복지관, 경로당, 공공근로, 노인일자리, 사회활동 지원사업]
  include_departments: [노인, 경로, 장애인, 복지, 돌봄, 일자리, 고용노동]   # 담당부서명 부분일치 시 통과 후보
  exclude_title_keywords: [공시송달, 도로점용, 굴착, 주민등록, 과태료, 지적, 도로명주소,
                           하천점용, 건설업, 담배소매, 수용재결, 무단방치, 입찰, 견적]
